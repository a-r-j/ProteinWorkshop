name: build

on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "CHANGELOG.md"

  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "CHANGELOG.md"

jobs:
  build_cpu:
    name: Build CPU
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - id: cache-dependencies
        name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.venv
          key: ${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: ${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install Workshop
        if: steps.cache-dependencies.cache-hit != 'true'
        run: |
          python -m pip install -U pip poetry
          python -m pip install -U pip poethepoet
          poetry --version
          poetry check --no-interaction
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --without docs
          poetry run install_pyg_workshop
          poe install-torchdrug

      - name: Run tests
        run: |
          poetry run pytest -v
