name: build

on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "CHANGELOG.md"

  pull_request:
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "CHANGELOG.md"

jobs:
  build_cpu:
    name: Build CPU
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: [3.9, "3.10"]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          miniforge-version: latest
          channels: "conda-forge, pytorch, pyg"
          python-version: ${{ matrix.python-version }}
          use-mamba: true
      - id: cache-dependencies
        name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.venv
          key: ${{ matrix.platform }}-py${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: ${{ matrix.platform }}-py${{ matrix.python-version }}-
      - name: Install Workshop
        if: steps.cache-dependencies.cache-hit != 'true'
        run: |
          python -m pip install -U pip poetry
          python -m pip install -U pip poethepoet
          poetry --version
          poetry check --no-interaction
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --without docs
          poetry run install_pyg_workshop
          poe install-torchdrug

      - name: Run tests
        run: |
          poetry run pytest -v
